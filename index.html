<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('elo-theme');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ELO! — Inglês de Verdade no Rio de Janeiro (eloingles.com.br)</title>
  <meta name="description" content="Aprenda inglês americano de verdade com professores nativos. Aulas ao vivo no Zoom, cursos de conversação e foco prático." />
  <meta property="og:title" content="ELO! — Inglês com Nativos | eloingles.com.br" />
  <meta property="og:description" content="Aulas particulares de conversação em inglês americano com professor nativo." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://eloingles.com.br/icon-512.png" />
  <meta name="theme-color" content="#111111" />

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/icon-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <!-- Apple / iPhone home screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ELO!" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

</head>

<body>
  <div id="root">
    <div style="min-height: 100vh; background-color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffffff; margin: 0; padding: 20px; box-sizing: border-box;">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);">
        E!
      </div>
      <div style="font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em;">ELO!</div>
      <div style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">Inglês de verdade com Nativos</div>
      <div style="width: 36px; height: 36px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: eloSpin 0.8s linear infinite;"></div>
      <style>
        @keyframes eloSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
